cross_cutting_rules:
- Check payload.userErrors on every mutation — validation failures ride inside a 200 OK.
- There is no idempotency key; create* mutations are not safe to retry, upsert* are.
- Environment is selected by hostname, not by a key prefix.
- Campaign and Ad are GraphQL interfaces; branch on __typename.
- MoneyValue and BigInt are strings; parse as decimal/bigint, never as a float.
- 429 carries no Retry-After and no published threshold; choose your own backoff.
