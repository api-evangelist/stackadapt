apis:
- aid: stackadapt:rest-api
  name: StackAdapt REST API
  description: Read-only REST API for fetching reporting data across dimensions and
    metrics to analyze campaign performance. Write operations are deprecated; use
    the GraphQL API for write operations.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.stackadapt.com/
  baseURL: https://api.stackadapt.com/service/v2
  tags:
  - Reporting
  - Campaigns
  - Performance Data
  - Analytics
  properties:
  - type: Documentation
    url: https://docs.stackadapt.com/
  - type: Authentication
    url: https://docs.stackadapt.com/
- aid: stackadapt:graphql-api
  name: StackAdapt GraphQL API
  description: Full-featured GraphQL API for creating and managing programmatic advertising
    campaigns, ad groups, creatives, targeting segments, pixel tracking, and performance
    reporting. The primary API for write operations on the StackAdapt platform.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.stackadapt.com/
  baseURL: https://api.stackadapt.com/graphql
  tags:
  - GraphQL
  - Campaigns
  - Ad Groups
  - Creatives
  - Targeting
  - Segments
  - Reporting
  properties:
  - type: Documentation
    url: https://docs.stackadapt.com/
  - type: SDKs
    url: https://www.npmjs.com/package/@stackadapt/pa-typescript-sdk
  - url: graphql/stackadapt-graphql.md
    type: GraphQL
  - type: GraphQLSchema
    url: graphql/stackadapt-schema.graphql
  - type: DataModel
    url: data-model/stackadapt-data-model.yml
  - type: Webhooks
    url: asyncapi/stackadapt-webhooks.yml
- aid: stackadapt:pixel-api
  name: StackAdapt Pixel API
  description: Server-to-server API for conversion tracking and audience generation
    without requiring website pixel installation.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.stackadapt.com/
  baseURL: https://tags.srv.stackadapt.com
  tags:
  - Pixel
  - Conversion Tracking
  - Audiences
  - Server-to-Server
  properties:
  - type: Documentation
    url: https://docs.stackadapt.com/
  - type: Components
    url: components/stackadapt-components.yml
  x-base-url-note: >-
    Corrected 2026-08-13. The previous baseURL, https://pixel.stackadapt.com, does not resolve
    (DNS NXDOMAIN). The real host is https://tags.srv.stackadapt.com/, read from StackAdapt's own
    first-party Google Tag Manager server-side tag template
    (https://github.com/StackAdapt/stackadapt-gtm-server-side-pixel, template.tpl:
    "let sa_url = 'https://tags.srv.stackadapt.com/' + pixel_type"). Paths are /rt, /drt, /lal,
    /conv and /saq_pxl.
- aid: stackadapt:data-taxonomy-api
  name: StackAdapt Data Taxonomy API
  description: API for secure data sharing and audience synchronization with third-party
    platforms and data partners.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.stackadapt.com/
  baseURL: https://api.stackadapt.com
  tags:
  - Data Sharing
  - Audience Sync
  - Data Taxonomy
  - Third-Party Integration
  properties:
  - type: Documentation
    url: https://docs.stackadapt.com/
- aid: stackadapt:mcp-server
  name: StackAdapt MCP Server
  description: Model Context Protocol server enabling AI agents (Claude, ChatGPT)
    to interact with the StackAdapt platform programmatically via the GraphQL API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.stackadapt.com/
  baseURL: https://mcp.stackadapt.com/
  tags:
  - MCP
  - AI Agents
  - Automation
  - Claude
  - ChatGPT
  properties:
  - type: Documentation
    url: https://docs.stackadapt.com/
  - type: MCPServer
    url: mcp/stackadapt-mcp.yml
  x-base-url-note: >-
    Corrected 2026-08-13. The previous baseURL, https://api.stackadapt.com, is the GraphQL/REST
    host, not the MCP endpoint. The hosted MCP server answers at the ROOT of
    https://mcp.stackadapt.com/ — probed live, returning HTTP 401 with a conformant
    WWW-Authenticate Bearer challenge and RFC 9728 protected-resource metadata at
    /.well-known/oauth-protected-resource. https://mcp.stackadapt.com/mcp returns 404.
