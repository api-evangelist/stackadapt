x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 24
  pass: local-v1
x-coverage:
  state: covered
  reason: null
  detail: >-
    Real first-party surface found and captured — a hosted MCP server at
    https://mcp.stackadapt.com/ with full RFC 9728/8414 OAuth discovery, a maintained llms.txt,
    a published Trust and Security Center, and an official npm SDK. Two gaps remain and both are
    StackAdapt's to close: there is no OpenAPI on any host (the REST v2 API has no machine-readable
    contract at all), and docs.stackadapt.com serves "User-agent: * / Disallow: /", so the
    developer reference, any changelog, the webhook payload schemas and the sandbox test values
    are not publicly readable by any crawler or agent. StackAdapt's own llms.txt acknowledges
    this: "Do not assume developer documentation is crawlable by all agents."
  evidence:
  - url: https://mcp.stackadapt.com/.well-known/oauth-protected-resource
    status: 200
  - url: https://www.stackadapt.com/llms.txt
    status: 200
  - url: https://docs.stackadapt.com/robots.txt
    status: 200
  - url: https://api.stackadapt.com/openapi.json
    status: 404
  checked: '2026-08-13'
