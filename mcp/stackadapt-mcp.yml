  note: >-
    tools/list and initialize both return HTTP 401 invalid_token without a bearer token, so the
    live tool manifest and its inputSchemas require authenticated introspection. NO TOOL LIST IS
    RECORDED HERE. StackAdapt does not publish a tool catalogue in its llms.txt or on any
    crawlable page, and docs.stackadapt.com disallows all crawlers in robots.txt, so there is no
    public source to fall back to. Capabilities are described in prose only (campaign
    configuration, performance metrics, creative assets); those are not tools and are not
    recorded as such.

