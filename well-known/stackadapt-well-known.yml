method: probed
source: live GET probes of every apis.yml baseURL host, the docs host, the website host and the MCP host
note: 'Four real documents were served. StackAdapt publishes RFC 8414 OAuth 2.0 Authorization Server Metadata
  on api.stackadapt.com, www.stackadapt.com and sandbox.stackadapt.com, and RFC 9728 OAuth 2.0 Protected
  Resource Metadata on mcp.stackadapt.com — the discovery chain a Model Context Protocol client walks
  to authorize against the hosted MCP server. No security.txt, no OpenID Connect discovery document, no
  api-catalog and no ai-plugin.json are served on any host. api.stackadapt.com answers 200 with the application''s
  HTML shell for /llms.txt and /robots.txt; those are soft-200s, not documents, and are recorded as misses.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
