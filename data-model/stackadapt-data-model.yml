polymorphism:
  interfaces: 18
  unions: 15
  discriminator: __typename
  note: >-
    Campaign, Ad, LibraryAd, Pixel, CustomSegment and AbmAudience are interfaces, not concrete
    types. A client MUST use inline fragments on __typename to read channel-specific fields.
    Campaign.channelType is documented in the schema as the human-readable form and __typename
    as the precise comparison — a real trap for generated clients that assume flat objects.

